# T-004: run the single project gate, `cargo xtask check`, on Windows for every push.
name: CI

on:
  push:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_DENY_VERSION: 0.22.1

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      # rustup reads rust-toolchain.toml and installs the pinned toolchain,
      # its components (rustfmt, clippy) and the wasm32 target.
      - name: Install pinned toolchain
        run: |
          rustup toolchain install
          cargo --version

      - name: Cache cargo-deny
        id: cache-deny
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/cargo-deny.exe
          key: cargo-deny-${{ env.CARGO_DENY_VERSION }}-${{ runner.os }}

      - name: Install cargo-deny
        if: steps.cache-deny.outputs.cache-hit != 'true'
        run: cargo install cargo-deny --version ${{ env.CARGO_DENY_VERSION }} --locked

      - name: cargo xtask check
        run: cargo xtask check
