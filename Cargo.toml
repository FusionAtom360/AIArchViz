[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/export",
    "crates/cli",
    "crates/mcp",
    "crates/agent",
    "crates/app",
    "crates/converters",
    "crates/eval",
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.lints.rust]
warnings = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
