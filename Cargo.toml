[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/export",
    "crates/cli",
    "crates/mcp",
    "crates/agent",
    "crates/app",
    "crates/converters",
    "crates/eval",
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false
license = "GPL-3.0-or-later"

[workspace.lints.rust]
warnings = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }

# T-199b: release builds panic on overflow instead of wrapping (REVIEW-1 M-5).
[profile.release]
overflow-checks = true
