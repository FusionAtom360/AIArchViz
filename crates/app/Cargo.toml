[package]
name = "archviz-app"
description = "C5 app: egui app and wgpu viewer."
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
archviz-cli = { version = "0.1.0", path = "../cli" }
archviz-core = { version = "0.1.0", path = "../core" }
archviz-export = { version = "0.1.0", path = "../export" }
eframe = { version = "0.37", default-features = false, features = ["wgpu", "clipboard"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
serde_json = { version = "1.0.154", default-features = false, features = ["std"] }
sha2 = { version = "0.10.9", default-features = false }
uuid = { version = "1.29.3", default-features = false, features = ["std", "v4"] }

[dev-dependencies]
proptest = { version = "1.12.0", default-features = false, features = ["std"] }
