[package]
name = "archviz-core"
description = "C1 core: document model, solver, commands, validation and pure export logic."
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[lints]
workspace = true

[dev-dependencies]
insta = "1.49.0"
jsonschema = { version = "0.63.2", default-features = false }
proptest = { version = "1.12.0", default-features = false, features = ["std"] }

[dependencies]
schemars = { version = "1.2.3", default-features = false, features = ["std", "derive", "uuid1"] }
serde = { version = "1.0.229", default-features = false, features = ["std", "derive"] }
serde_json = { version = "1.0.154", default-features = false, features = ["std"] }
uuid = { version = "1.29.3", default-features = false, features = ["serde", "v5"] }
